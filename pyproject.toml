[project]
name = "alpha_engine"
version = "0.1.0"
description = "Read-only research repo for exploring EOD equity data populated by eodhd_client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.dependencies]
pandas = ">=2.0"
SQLAlchemy = ">=2.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["alpha_engine", "alpha_engine.maintenance"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
pretty = true
